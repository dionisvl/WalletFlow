version: 2

# Lowercase names for the binary and archives, whatever the repository is called.
project_name: walletflow

builds:
  - main: ./cmd/walletflow
    binary: walletflow
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - README.ru.md
      - LICENSE
      - THIRD_PARTY.md
      - .env.example

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:']
